title_en: About
title_fr: À propos
photo: /uploads/images/placeholder-portrait.svg
body_en: |
  I grew up in France and moved to New York with a suitcase full of books. After years of teaching French in schools and language centers, I now work with students one-on-one, where I can give each person exactly what they need.

  My approach is simple: speak from the very first lesson, make grammar visible rather than scary, and surround yourself with real French, from songs and films to bakery menus.

  Outside of lessons you will find me at the farmers' market, in a bookshop, or trying to find the best croissant in Brooklyn.
body_fr: |
  J'ai grandi en France et je suis arrivée à New York avec une valise pleine de livres. Après des années d'enseignement du français en école et en centre de langues, je travaille aujourd'hui en cours particuliers, pour offrir à chacun exactement ce dont il a besoin.

  Ma méthode est simple : parler dès le premier cours, rendre la grammaire visible plutôt qu'intimidante, et s'entourer de vrai français, des chansons aux films en passant par les menus de boulangerie.

  En dehors des cours, vous me trouverez au marché, dans une librairie, ou à la recherche du meilleur croissant de Brooklyn.
daefle_heading_en: What is the DAEFLE?
daefle_heading_fr: Qu'est-ce que le DAEFLE ?
daefle_body_en: |
  The **DAEFLE** (Diplôme d'aptitude à l'enseignement du français langue étrangère) is a professional teaching diploma awarded by the *Alliance Française de Paris* and the CNED. It certifies training in language pedagogy, lesson design, and assessment specifically for teaching French to non-native speakers.
daefle_body_fr: |
  Le **DAEFLE** (Diplôme d'aptitude à l'enseignement du français langue étrangère) est un diplôme professionnel délivré par l'*Alliance Française de Paris* et le CNED. Il atteste d'une formation en pédagogie des langues, en conception de cours et en évaluation, spécifiquement pour l'enseignement du français aux non-francophones.
