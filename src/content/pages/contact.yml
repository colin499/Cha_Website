title_en: Contact & Booking
title_fr: Contact et réservation
intro_en: The easiest first step is a free 20-minute consultation. Pick a time below, or send me a message and I will get back to you.
intro_fr: "Le plus simple pour commencer : un premier échange gratuit de 20 minutes. Choisissez un créneau ci-dessous, ou envoyez-moi un message."
booking_heading_en: Book a free consultation
booking_heading_fr: Réserver un premier échange gratuit
booking_text_en: Choose a slot that works for you. We will talk about your goals and I will suggest a plan.
booking_text_fr: Choisissez le créneau qui vous convient. Nous parlerons de vos objectifs et je vous proposerai un plan.
booking_placeholder_en: Online booking is coming soon. In the meantime, send a message below.
booking_placeholder_fr: La réservation en ligne arrive bientôt. En attendant, envoyez-moi un message ci-dessous.
form_heading_en: Send a message
form_heading_fr: Envoyer un message
form_text_en: Prefer to write? Tell me a little about who the lessons are for and I will reply within two business days.
form_text_fr: Vous préférez écrire ? Dites-moi pour qui sont les cours et je vous répondrai sous deux jours ouvrés.
