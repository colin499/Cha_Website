faq_heading_en: Questions families often ask
faq_heading_fr: Les questions fréquentes
faq:
  - q_en: Where do in-person lessons take place?
    q_fr: Où ont lieu les cours en présentiel ?
    a_en: At your home in Manhattan or Brooklyn. Other boroughs may be possible with a small travel fee.
    a_fr: À votre domicile à Manhattan ou Brooklyn. Les autres arrondissements sont possibles avec un petit supplément de déplacement.
  - q_en: What is your cancellation policy?
    q_fr: Quelle est votre politique d'annulation ?
    a_en: Lessons cancelled with at least 24 hours' notice can be rescheduled at no charge.
    a_fr: Les cours annulés au moins 24 heures à l'avance peuvent être reportés sans frais.
  - q_en: Do you teach complete beginners?
    q_fr: Enseignez-vous aux grands débutants ?
    a_en: Absolutely. Many of my students started with no French at all.
    a_fr: Bien sûr. Beaucoup de mes élèves ont commencé sans aucune notion de français.
