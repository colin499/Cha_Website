pricing_heading_en: Rates
pricing_heading_fr: Tarifs
pricing_note_en: All rates are per session. Packages of 10 lessons receive a 10% discount. A first 20-minute consultation is always free.
pricing_note_fr: Tarifs par séance. Les forfaits de 10 cours bénéficient de 10 % de réduction. Le premier échange de 20 minutes est toujours gratuit.
