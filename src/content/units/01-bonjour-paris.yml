title_en: "Unit 1 · Bonjour, Paris!"
title_fr: "Unité 1 · Bonjour, Paris !"
order: 1
published: true
level: Les Petits
age_band_en: Ages 5–7
age_band_fr: 5–7 ans
summary_en: Greetings, names, colors, and numbers to 10, through a walk across Paris with a very curious cat.
summary_fr: Salutations, prénoms, couleurs et nombres jusqu'à 10, au fil d'une promenade dans Paris avec un chat très curieux.
body_en: |
  **Duration:** 5 weeks · about 3 hours per week

  **Objectives**
  - Greet and introduce oneself
  - Name 8 colors and count to 10
  - Sing two traditional French songs from memory

  **Included:** parent guide, 10 lesson plans, printable picture cards, audio recordings, a mini-book to color, and a simple end-of-unit checklist.
body_fr: |
  **Durée :** 5 semaines · environ 3 heures par semaine

  **Objectifs**
  - Saluer et se présenter
  - Nommer 8 couleurs et compter jusqu'à 10
  - Chanter deux chansons traditionnelles de mémoire

  **Inclus :** guide parent, 10 plans de cours, cartes-images imprimables, enregistrements audio, un mini-livre à colorier et une petite liste de vérification de fin d'unité.
