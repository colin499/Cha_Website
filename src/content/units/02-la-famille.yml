title_en: "Unit 2 · La famille et la maison"
title_fr: "Unité 2 · La famille et la maison"
order: 2
published: true
level: Les Explorateurs
age_band_en: Ages 8–11
age_band_fr: 8–11 ans
summary_en: Family, rooms of the house, and daily routines. First reading of short texts and first written sentences.
summary_fr: La famille, les pièces de la maison et les routines quotidiennes. Premières lectures de textes courts et premières phrases écrites.
body_en: |
  **Duration:** 6 weeks · about 3 hours per week

  **Objectives**
  - Describe one's family and home
  - Use *avoir* and *être* in the present tense
  - Read and write 5 short sentences about a typical day

  **Included:** parent guide, 12 lesson plans, reading booklet, writing worksheets, audio, and a family-tree project.
body_fr: |
  **Durée :** 6 semaines · environ 3 heures par semaine

  **Objectifs**
  - Décrire sa famille et sa maison
  - Utiliser *avoir* et *être* au présent
  - Lire et écrire 5 phrases courtes sur une journée type

  **Inclus :** guide parent, 12 plans de cours, livret de lecture, fiches d'écriture, audio et un projet d'arbre généalogique.
