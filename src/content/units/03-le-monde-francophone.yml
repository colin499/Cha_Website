title_en: "Unit 3 · Le monde francophone"
title_fr: "Unité 3 · Le monde francophone"
order: 3
published: true
level: Les Grands
age_band_en: Ages 12–16
age_band_fr: 12–16 ans
summary_en: A tour of French-speaking countries, the passé composé, and a short research presentation in French.
summary_fr: Un tour des pays francophones, le passé composé et un court exposé de recherche en français.
body_en: |
  **Duration:** 6 weeks · about 4 hours per week

  **Objectives**
  - Narrate past events using the passé composé
  - Compare cultures of three francophone countries
  - Deliver a 3-minute presentation in French

  **Included:** parent guide, 12 lesson plans, reading and listening texts, grammar practice, rubric for the presentation, and DELF Junior A2-style practice tasks.
body_fr: |
  **Durée :** 6 semaines · environ 4 heures par semaine

  **Objectifs**
  - Raconter des événements passés au passé composé
  - Comparer les cultures de trois pays francophones
  - Présenter un exposé de 3 minutes en français

  **Inclus :** guide parent, 12 plans de cours, textes de lecture et d'écoute, exercices de grammaire, grille d'évaluation de l'exposé et tâches d'entraînement de type DELF Junior A2.
